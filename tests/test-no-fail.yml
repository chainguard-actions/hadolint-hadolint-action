name: Test no-fail mode - lint Dockerfile with issues without failing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: hadolint
        uses: .
        with:
          dockerfile: tests/fixtures/Dockerfile.issues
          no-fail: 'true'
      - name: Assert action did not fail and results contain issues
        env:
          RESULTS: ${{ steps.hadolint.outputs.results }}
        run: |
          echo "results: '$RESULTS'"
          # The Dockerfile.issues has known problems (FROM ubuntu:latest, split RUN)
          # With no-fail=true the step should succeed even with lint issues
          if [ -z "$RESULTS" ]; then
            echo "WARN: expected lint issues but got empty results"
          else
            echo "PASS: lint issues detected as expected: $RESULTS"
          fi
          echo "PASS: action completed with no-fail mode"
