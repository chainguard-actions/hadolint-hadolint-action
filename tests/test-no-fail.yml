name: Test no-fail mode - invalid Dockerfile should not fail pipeline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          dockerfile: tests/fixtures/Dockerfile.invalid
          no-fail: 'true'

      - name: Assert action did not fail despite lint violations
        run: |
          echo "PASS: action completed without failing despite lint violations"
