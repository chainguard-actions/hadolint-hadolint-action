name: Test basic usage - valid Dockerfile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          dockerfile: tests/fixtures/Dockerfile.valid
          no-fail: 'false'

      - name: Assert action succeeded (no lint errors)
        run: |
          echo "PASS: action completed successfully with a valid Dockerfile"
