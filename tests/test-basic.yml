name: Test basic usage - lint valid Dockerfile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: hadolint
        uses: .
        with:
          dockerfile: tests/fixtures/Dockerfile.valid
          no-fail: 'true'
      - name: Assert results output exists
        env:
          RESULTS: ${{ steps.hadolint.outputs.results }}
        run: |
          echo "results: '$RESULTS'"
          # For a valid Dockerfile, results should be empty (no issues)
          if [ -n "$RESULTS" ]; then
            echo "INFO: hadolint reported issues: $RESULTS"
          else
            echo "PASS: no lint issues found"
          fi
          echo "PASS: action completed successfully"
