name: Test failure-threshold - only fail on errors not warnings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          dockerfile: tests/fixtures/Dockerfile.invalid
          failure-threshold: 'error'
          format: 'tty'

      - name: Assert action passed because violations are below error threshold
        run: |
          echo "PASS: action completed - warnings/info violations did not exceed error threshold"
