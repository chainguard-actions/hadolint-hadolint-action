name: Test failure-threshold - only fail on errors above threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: hadolint
        uses: .
        with:
          dockerfile: tests/fixtures/Dockerfile.issues
          # Set threshold to 'error' so only actual errors cause failure
          # The issues in Dockerfile.issues are warnings/info, not errors
          failure-threshold: 'error'
      - name: Assert action succeeded with high failure threshold
        env:
          RESULTS: ${{ steps.hadolint.outputs.results }}
        run: |
          echo "results: '$RESULTS'"
          echo "PASS: action completed - only errors above 'error' threshold would fail"
